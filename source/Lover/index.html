<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小艾</title>
  <style>
    .searchContainer {
      display: flex;
      justify-content: center;
    }

    .search {
      display: inline-block;
      width: 2em;
      height: 2em;
      text-align: center;
      border: none;
      border-radius: 20%;
      margin-left: 1.5em;
    }

    .search i {
      width: 2em;
      height: 2em;
      font-size: 25px;
    }

    .search:hover {
      cursor: pointer;
    }

    .searchWeather {
      height: 2em;
      outline: none;
      border: none;
      border-bottom: 1px solid #ccc;
    }

    .searchWeather:focus {
      border-bottom: 2px solid #4285f4;
    }

    .showInfo {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* border: 2px solid #4285f4; */
      margin-top: 3em;
    }

    .showInfo .temperature {
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 85px;
      font-family: KaiTi, FZShuTi;
      opacity: 0.5;
      text-shadow: 4px 6px 2px #ccc;
    }

    .showInfo .city {
      font-size: 30px;
      font-family: "Lucida Console";
      margin-bottom: 12px;
    }

    .showInfo .weather {
      margin-top: 12px;
    }

    .countDown {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      padding: 0 50px 12px 16px;
      font-size: 16px;
      margin-top: 20px;
    }

    .countDown .relationship {
      flex: 0 0 auto;
      white-space: nowrap;
      line-height: 1.2;
    }

    .countDown .timeBox {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      white-space: nowrap;
    }

    .countDown .value {
      font-size: 32px;
      line-height: 1;
    }

    .countDown .label {
      font-size: 14px;
    }

    .lovelyPic {
      display: inline-block;
      position: absolute;
      right: -48px;
      bottom: -15px;
      width: 250px;
      height: 140px;
      background-image: url(/img/comment.webp);
    }

    .pageMessage {
      position: fixed;
      top: 76px;
      left: 50%;
      z-index: 2147483647;
      max-width: min(420px, calc(100vw - 32px));
      padding: 12px 18px;
      border: 1px solid rgba(239, 128, 132, 0.28);
      border-left: 4px solid #ef8084;
      border-radius: 10px;
      color: #4b5563;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 8px 28px rgba(65, 48, 48, 0.2);
      font-size: 14px;
      line-height: 1.5;
      opacity: 0;
      transform: translate(-50%, -10px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .pageMessage.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    [data-user-color-scheme='dark'] .pageMessage {
      color: #e5e7eb;
      border-color: rgba(255, 143, 150, 0.24);
      border-left-color: #ff8f96;
      background: rgba(38, 45, 56, 0.98);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-user-color-scheme]) .pageMessage {
        color: #e5e7eb;
        border-color: rgba(255, 143, 150, 0.24);
        border-left-color: #ff8f96;
        background: rgba(38, 45, 56, 0.98);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
      }
    }

    @media screen and (max-width: 900px) {
      .countDown {
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        padding: 0 12px 16px;
        min-height: 160px;
        background-image: url(/img/comment.webp);
        background-repeat: no-repeat;
        background-position: 34% 0;
      }

      .countDown .timeBox {
        flex-wrap: wrap;
        justify-content: center;
        white-space: normal;
      }

      .countDown .value {
        font-size: 26px;
      }

      .lovelyPic {
        width: 0;
        height: 0;
      }
    }
  </style>
</head>

<body>
  <div class="searchContainer">
    <input type="text" placeholder="输入你的城市..." class="searchWeather" autocomplete="off" />
    <span class="search">
      <i class="iconfont icon-search"></i>
    </span>
  </div>
  <div class="showInfo">
    <div class="city"></div>
    <div class="temperature"></div>
    <div class="weather">当前的天气为：</div>
  </div>
  <div class="countDown">
    <div class="relationship">
      和<span style="font-size: 16px; color: rgb(156, 48, 48)">老大</span>在一起
    </div>
    <div class="timeBox">
      <span class="value day"></span><span class="label">天</span>
      <span class="value hour"></span><span class="label">时</span>
      <span class="value minute"></span><span class="label">分</span>
      <span class="value second"></span><span class="label">秒</span>
    </div>
  </div>
  <span class="lovelyPic"></span>
  <div class="pageMessage" role="status" aria-live="polite"></div>
</body>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js"></script>
<!-- 获取IP地址 -->
<!-- <script src="https://pv.sohu.com/cityjson?ie=utf-8"></script> -->
<script src="https://cdn.bootcdn.net/ajax/libs/axios/0.21.1/axios.min.js"></script>

<script type="module">
  let input = document.querySelector(".searchWeather");
    let search = document.querySelector(".search");
    let weather = document.querySelector(".weather");
    let temperature = document.querySelector(".temperature");
    let city = document.querySelector(".city");
    let countDown = document.querySelector(".countDown");
    const day = document.querySelector(".day");
    const hour = document.querySelector(".hour");
    const minute = document.querySelector(".minute");
    const second = document.querySelector(".second");
    const pageMessage = document.querySelector(".pageMessage");
    // Keep the toast outside theme wrappers that create their own stacking context.
    document.body.appendChild(pageMessage);
    let messageTimer;

    function showMessage(message) {
      pageMessage.textContent = message;
      pageMessage.classList.add("is-visible");
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        pageMessage.classList.remove("is-visible");
      }, 2800);
    }

    // 节流，防止点击多次
    function throttle(func, wait) {
      var previous = 0;
      return function () {
        let now = Date.now();
        let context = this;
        let args = arguments;
        if (now - previous > wait) {
          func.apply(context, args);
          previous = now;
        }
      };
    }
    let address = "";
    //获取ip地址
    async function getIp(){
      try {
        const {data} = await axios({
          method:"get",
          url:"https://www.mxnzp.com/api/ip/self?app_id=qkojmgehinljmiur&app_secret=aU5BcjZsQStqWWNxMEtxN0w5ZlB1QT09"
        });

        const cityName = data?.data?.city;
        if (!cityName) throw new Error("IP 定位接口没有返回城市名");
        getInfo(cityName);
      } catch (err) {
        console.error("IP 定位失败：", err);
        // IP 定位不可用时，仍尝试显示默认城市天气。
        getInfo();
      }
    //   const ip = data.data.ip;
    //   address = await axios({
    //     method:"get",
    //     url:`https://v2.alapi.cn/api/ip?ip=${ip}&token=eETQpxcYEcdBOV4Y`
    //   })
    //   console.log(address.data.data.ad_info.city);
    //   getInfo(address.data.data.ad_info.city)
    // }
    }
    // 根据ip地址先显示当前地址的天气
    getIp();
 
    // 获取天气信息
    async function getInfo(chengshi = "北京") {
      try {
        const { data } = await axios({
          method: "GET",
          url: `https://api.seniverse.com/v3/weather/now.json?key=S8iUfojW28_QulLmE&location=${encodeURIComponent(chengshi)}&language=zh-Hans&unit=c`,
        });
        const getData = data?.results?.[0];
        if (!getData?.now || !getData?.location) {
          throw new Error("天气接口返回的数据格式不正确");
        }
        const weatherInfo = getData.now;
        const locationInfo = getData.location;
        // 为页面添加数据
        const cityPinyin = window.pinyinPro?.pinyin?.(locationInfo.name);
        city.innerHTML = (cityPinyin ? cityPinyin + " " : "") + locationInfo.name;
        weather.innerHTML = weather.innerHTML.substr(0, 7) + weatherInfo.text;
        temperature.innerHTML = weatherInfo.temperature + "℃";
      } catch (err) {
        console.error("获取天气失败：", err);
        const status = err.response?.status;
        if (status === 404) {
          showMessage("找不到这个城市，请检查名称后重试");
        } else if (status === 403) {
          showMessage("请求太频繁啦，请稍后再试");
        } else {
          showMessage("天气加载失败，请检查网络或稍后重试");
        }
      }
    }
    // 搜索特定城市天气
    function searchInfo() {
      let residence = input.value.trim();
      getInfo(residence);
    }
    search.addEventListener(
      "click",
      throttle(function () {
        // 判断输入框是否有内容
        if (input.value.trim() !== "") {
          searchInfo();
          console.log(1);
        } else showMessage("先输入城市名称再搜索哦");
      }, 3000)
    );

    input.addEventListener("keyup", function (event) {
      if (event.keyCode === 13) {
        // 判断输入框是否有内容
        if (input.value.trim() !== "") {
          searchInfo();
        } else showMessage("先输入城市名称再搜索哦");
      }
    });

    setInterval(() => {
      formatDateTime();
    }, 1000);
    formatDateTime();

    // 在一起时间的倒计时
    function formatDateTime() {
      let passTime = "2019/3/17";
      let newDate = new Date();
      let x = newDate.valueOf() - new Date(passTime).valueOf();
      var d = parseInt(x / 1000 / 60 / 60 / 24);
      d = d < 10 ? "0" + d : d;
      var h = parseInt((x / 1000 / 60 / 60) % 24);
      h = h < 10 ? "0" + h : h;
      var m = parseInt((x / 1000 / 60) % 60);
      m = m < 10 ? "0" + m : m;
      var s = parseInt((x / 1000) % 60);
      s = s < 10 ? "0" + s : s;

      day.innerHTML = d;
      hour.innerHTML = h;
      minute.innerHTML = m;
      second.innerHTML = s;
    }
  </script>

</html>
